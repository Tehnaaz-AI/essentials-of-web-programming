<!DOCTYPE html>
<html>

<head>

<title>Internal CSS</title>

<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#eef2ff;

font-family:Arial;

}

.bottle{

width:320px;

padding:20px;

background:white;

border:2px solid #4f46e5;

border-radius:15px;

text-align:center;

box-shadow:0 10px 20px rgba(0,0,0,.2);

transition:.3s;

}

.bottle:hover{

transform:translateY(-8px);

}

img{

width:120px;

height:120px;

border-radius:50%;

border:4px solid #4f46e5;

}

h1{

color:#4f46e5;

}

p{

color:gray;

}

button{

padding:10px 25px;

background:#4f46e5;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#312e81;

}

</style>

</head>

<body>

<div class="bottle">

    <img src="https://picsum.photos/120">

    <h1>John Doe</h1>

    <p>Frontend Developer</p>

    <button>Follow</button>

</div>

</body>

</html>
