<!DOCTYPE html>
<html>
<head>
<style>
*{
    font-family: Arial;
}

h1{
    color: black;
}

#title{
    background-color: rgb(170, 219, 170);
    border: 2px solid black;
    padding: 10px;
}

.note{
    color: green;
}

a:hover{
    color: red;
    font-size: 20px;
}

input:focus{
    background-color: lightblue;
}

li:first-child{
    color: purple;
}

li:last-child{
    color: orange;
}

li:nth-child(2){
    color: blue;
}
</style>
title>Classes</title>
</head>
<body>

<h1 id="title">CSS Selectors & Pseudo-Classes</h1>

<p class="note">This is Paragraph 1.</p>
<p class="note">This is Paragraph 2.</p>

<a href="#">Hover Over Me</a>

<br><br>

<input type="text" placeholder="Click here">

<ul>
    <li>First Item</li>
    <li>Second Item</li>
    <li>Third Item</li>
</ul>

</body>
</html>
