<!DOCTYPE html> <!-- Declares the document as HTML5 -->

<html>

<head>
    <!-- Title displayed on the browser tab -->
    <title>HTML Basics</title>
</head>

<body>

    <!-- ================= HEADING TAGS ================= -->

    <h1>Heading 1</h1> <!-- Largest heading -->
    <h2>Heading 2</h2> <!-- Second largest heading -->
    <h3>Heading 3</h3> <!-- Third level heading -->
    <h4>Heading 4</h4> <!-- Fourth level heading -->
    <h5>Heading 5</h5> <!-- Fifth level heading -->
    <h6>Heading 6</h6> <!-- Smallest heading -->

    <hr> <!-- Horizontal line -->

    <!-- ================= PARAGRAPH ================= -->

    <p>
        HTML stands for HyperText Markup Language.
        It is used to create web pages.
    </p>

    <hr>

    <!-- ================= LINE BREAK ================= -->

    This is the first line.<br> <!-- Moves text to the next line -->
    This is the second line.

    <hr>

    <!-- ================= HYPERLINKS ================= -->

    <!-- Opens Google in the same browser tab -->
    <a href="https://www.google.com">
        Visit Google
    </a>

    <br><br>

    <!-- Opens Wikipedia in a new browser tab -->
    <a href="https://www.wikipedia.org" target="_blank">
        Visit Wikipedia
    </a>

    <hr>

    <!-- ================= IMAGES ================= -->

    <!-- Displays an image from the project folder -->
    <img src="sample-2.jpeg"
         alt="Sample Image"
         width="300"
         height="200">

    <br><br>

    <!-- Displays an image from the local computer (Not recommended for websites) -->
    <img src="D:\Notes\essentials-of-web-programming\sample-1.jpeg"
         alt="Local Image"
         width="300"
         height="200">

</body>

</html>
